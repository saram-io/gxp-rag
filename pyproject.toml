[project]
name = "gxp-rag"
version = "0.1.0"
description = "AI GxP Document Draft Agent with Pydantic AI, Qdrant RAG, HITL 21 CFR Part 11 Approval, and Multi-LLM Support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.30",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
gxp-rag = "gxp_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
